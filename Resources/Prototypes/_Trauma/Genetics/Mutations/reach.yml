- type: entity
  parent: BaseMutation
  id: MutationTelekinesis
  name: Телекинез
  description: Странная мутация, позволяющая носителю взаимодействовать с объектами силой мысли.
  components:
  - type: Mutation
    instability: 35
    difficulty: 18
    rarity: Mythical
  - type: ComponentMutation
    added:
    - type: Telekinesis
    - type: TetherGun # surely this won't conflict with anything in the future
      lineColor: "#18a2d5"
  - type: ActionMutation
    action: ActionMutationTelekinesis

- type: entity
  parent: BaseAction
  id: ActionMutationTelekinesis
  name: Использовать телекинез
  description: Перемещайте объекты, используя всю мощь своего разума!
  components:
  - type: Action
    raiseOnUser: true
    icon:
      sprite: Mobs/Species/Human/organs.rsi
      state: brain
    itemIconStyle: BigAction
    useDelay: 1
  - type: TargetAction
    checkCanAccess: false
    range: 18 # anti trolling, should be outside PVS anyway
  - type: EntityTargetAction
    whitelist:
      components:
      - Item
      - MobState
      - Physics
    blacklist:
      components:
      - PhysicsGunBlacklist
    canTargetSelf: true # for easy deselecting
    rotateOnUse: false # its with your mind jimbo
    event: !type:TelekinesisActionEvent

- type: entity
  parent: BaseMutation
  id: MutationElasticArms
  name: Эластичные руки
  description: Руки подопытного стали невероятно эластичными, что позволяет им растягиваться почти на метр. Однако из-за этого становится трудно носить перчатки, выполнять сложные задачи или удерживать крупные объекты.
  components:
  - type: Mutation
    instability: 35
    difficulty: 24 # good luck chuddy
    rarity: Mythical
  # TODO: prevent wearing gloves, disable picking up two handed items
  - type: EffectsMutation
    added:
    - !type:RelayBodyParts
      guidebookText: entity-effect-guidebook-increases-reach
      conditions:
      - !type:MobStateCondition
        mobstate: Alive
      partType: Arm
      effects:
      - !type:AddComponents
        guidebookText: entity-effect-guidebook-increases-reach
        conditions:
        - !type:WhitelistCondition # has to be an organic arm
          blacklist:
            components:
            - Cybernetics
        components:
        - type: ExtraReach
          bonus: 0.5 # both arms add to 1m
    removed:
    - !type:RelayBodyParts
      guidebookText: entity-effect-guidebook-decreases-reach
      partType: Arm
      effects:
      - !type:RemoveComponents
        guidebookText: entity-effect-guidebook-decreases-reach
        components:
        - type: ExtraReach
