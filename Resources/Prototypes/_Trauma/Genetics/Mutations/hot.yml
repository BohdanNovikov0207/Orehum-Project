- type: entity
  parent: BaseMutation
  id: MutationCindikinesis
  name: Циндикинез
  description: Позволяет носителю концентрировать окружающее тепло в кучку пепла.
  components:
  - type: Mutation
    instability: 10
    difficulty: 10
  - type: RemovesMutation
    removes:
    - MutationGeladikinesis
  - type: ActionMutation
    action: ActionMutationCindikinesis

- type: entity
  parent: BaseMutation
  id: MutationPyrokinesis
  name: Пирокинез
  description: Извлекает положительную энергию из окружения, чтобы нагревать температуру вокруг по воле подопытного.
  components:
  - type: Mutation
    instability: 25
    difficulty: 12
    rarity: Rare
  - type: RemovesMutation
    removes:
    - MutationCryokinesis
  - type: ActionMutation
    action: ActionMutationPyrokinesis

- type: entity
  parent: BaseConjureAction
  id: ActionMutationCindikinesis
  name: Создать пепел
  description: Концентрирует пирокинетические силы для создания пепла. Полезно... примерно ни для чего.
  components:
  - type: Action
    itemIconStyle: BigAction
    icon:
      sprite: Objects/Materials/materials.rsi
      state: ash
  - type: ConjureAction
    spawn: Ash

- type: entity
  parent: BaseAction
  id: ActionMutationPyrokinesis
  name: Пиролуч
  description: Эта способность выпускает в цель раскаленный энергетический заряд.
  components:
  - type: Action
    useDelay: 30
    itemIconStyle: BigAction
    raiseOnUser: true
    sound: /Audio/Weapons/Guns/Gunshots/taser2.ogg
    icon:
      sprite: _Trauma/Actions/mutations.rsi
      state: firebeam
  - type: TargetAction
    range: 60
    checkCanAccess: false
  - type: WorldTargetAction
    event: !type:ProjectileSpellEvent
      prototype: BulletTemperaturePyro
