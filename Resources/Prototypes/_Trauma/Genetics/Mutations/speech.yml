- type: entity
  parent: BaseFreeMutation
  id: MutationNervousness
  name: Нервозность
  description: Заставляет носителя заикаться.
  components:
  - type: ComponentMutation
    added:
    - type: StutteringAccent

- type: entity
  parent: BaseFreeMutation
  id: MutationWacky
  name: Клоунада
  description: Ты не клоун. Ты — весь этот цирк целиком.
  components:
  - type: SpeechFontOverride
    font: LDFComicSans
    sourceOnly: false

- type: entity
  parent: BaseFreeMutation
  id: MutationHeckaciousLarincks
  name: Адская гортань
  description: блин че ВООБЩЕ твои слова чувак...........
  components:
  - type: RemovesMutation
    removes:
    - MutationStoner
  - type: ReplacementAccent
    accent: Heckacious # not the same as ss13 but dear god im not writing all that byond shitcode

# fun fact: mimes can take this then remove it to speak with vow intact
- type: entity
  parent: BaseMutation
  id: MutationMute
  name: Немота
  description: Полностью блокирует речевой отдел мозга.
  components:
  - type: Mutation
    instability: -40
  - type: RemovesMutation
    removes:
    - MutationUnintelligible # no free -70
  - type: ComponentMutation
    added:
    - type: Muted

- type: entity
  parent: BaseMutation
  id: MutationUnintelligible
  name: Нечленораздельность
  description: Частично подавляет речевой центр мозга, сильно искажая речь.
  components:
  - type: Mutation
    instability: -30
    conflicts:
    - MutationMute # can upgrade to Mute
  # TODO

- type: entity
  parent: BaseFreeMutation
  id: MutationSwedish
  name: Швед
  description: Ужасная мутация, пришедшая из далекого прошлого. Считалась искорененной после инцидента 2037 года.
  components:
  - type: CharactersAccent
    chars:
      w: [ "v" ]
      j: [ "y" ]
      b: [ "bj" ]
      a: [ "å", "ä", "æ", "a" ]
      o: [ "ö", "ø", "o" ]

- type: entity
  parent: BaseFreeMutation
  id: MutationChav
  name: Гопник
  description: Неизвестно
  components:
  - type: BritishAccent

- type: entity
  parent: [ BaseFreeMutation, BaseTriggerMutation ]
  id: MutationElvis
  name: Элвис
  description: "Пугающая мутация, названная в честь её «нулевого пациента»."
  components:
  - type: ReplacementAccent
    accent: Elvis
  - type: RandomTrigger
    prob: 0.075 # 7.5%
  - type: EntityEffectOnTrigger
    effects:
    - !type:RelayMutated
      effect: !type:NestedEffect
        conditions:
        - !type:NestedCondition
          proto: IsAwake
        - !type:InContainerCondition
          inverted: true # can't dance inside a locker bro
        proto: MutationElvisDance

- type: entity
  parent: BaseFreeMutation
  id: MutationStoner
  name: Укурок
  description: Распространенная мутация, серьезно снижающая интеллект.
  # TODO

- type: entity
  parent: BaseFreeMutation
  id: MutationMedieval
  name: Средневековье
  description: Жуткая мутация родом из далекого прошлого. Считается, что когда-то этот ген был обычным делом во всей старой Европе.
  components:
  - type: MedievalAccent

- type: entity
  parent: BaseFreeMutation
  id: MutationPigLatin
  name: Поросячья латынь
  description: Историки говорят, что в 2020-х годах человечество полностью общалось на этом мистическом языке.
  components:
  - type: PigLatinAccent
