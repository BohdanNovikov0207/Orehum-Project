- type: entity
  parent: BaseMutation
  id: MutationShockTouch
  name: Шоковое касание
  description: Носитель может пропускать избыток электричества через свои руки, не травмируя себя, что позволяет бить током других. Почти безвредно! Почти...
  components:
  - type: Mutation
    instability: 25
    difficulty: 16
    rarity: Mythical
  - type: ActionMutation
    action: ActionMutationShockTouch

- type: entity
  parent: BaseMutationAction
  id: ActionMutationShockTouch
  name: Шоковое касание
  description: Направьте электричество в ладонь, чтобы ударить кого-нибудь током. Почти безвредно! Почти...
  components:
  - type: Action
    useDelay: 7
    icon:
      sprite: _Trauma/Actions/mutations.rsi
      state: zap
  - type: TargetAction
  - type: EntityTargetAction
    whitelist:
      components:
      - Damageable
    event: !type:EffectTargetActionEvent
  - type: EffectAction
    effects:
    - !type:Electrocute
      bypassInsulation: false # you are kind enough to only touch them on their insuls <3

- type: entity
  parent: BaseMutation
  id: MutationMendingTouch
  name: Исцеляющее касание
  description: Носитель может возлагать руки на других людей, перенося часть их ранений на себя.
  components:
  - type: Mutation
    instability: 35
    difficulty: 16
    rarity: Mythical
  - type: ActionMutation
    action: ActionMutationMendingTouch
  # TODO: jesus christ this has a lot of logic

- type: entity
  parent: BaseAction
  id: ActionMutationMendingTouch
  name: Исцеляющее касание
  description: Носитель может возлагать руки на других людей, перенося часть их ранений на себя.
  components:
  - type: Action
    useDelay: 12
    icon:
      sprite: _Trauma/Actions/mutations.rsi
      state: mending_touch
  - type: TargetAction
  - type: EntityTargetAction
    whitelist:
      requireAll: true
      components:
      - Damageable
      - Body
