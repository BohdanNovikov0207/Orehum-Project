- type: entity
  parent: BaseMutation
  id: MutationAutotomy
  name: Автотомия
  description: Позволяет существу добровольно отторгать случайную конечность.
  components:
  - type: Mutation
    instability: 10 # how is this good?
  - type: ActionMutation
    action: ActionMutationAutotomy

- type: entity
  parent: BaseMutationAction
  id: ActionMutationAutotomy
  name: Отбросить конечность
  description: Сосредоточьтесь, чтобы одна из ваших конечностей просто отвалилась.
  components:
  - type: Action
    useDelay: 10
    icon:
      sprite: _Trauma/Actions/mutations.rsi
      state: autotomy
    itemIconStyle: BigAction
  - type: InstantAction
    event: !type:EffectInstantActionEvent
  - type: EffectAction
    effects:
    - !type:RelayRandomPart
      # No torso or head.
      types: [ Foot, Hand, Leg, Arm, Tail ]
      effect: !type:DetachOrgan
      failEffect: !type:PopupMessage
        messages:
        - entity-effect-popup-autotomy-failed
