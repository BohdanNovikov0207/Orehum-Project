- type: entity
  parent: BaseMutation
  id: MutationNearSightedness
  name: Близорукость
  description: Носитель этой мутации очень плохо видит вдаль.
  components:
  - type: Mutation
    instability: -30
    # no free -70 chuddha
    conflicts:
    - MutationBlindness
  - type: ComponentMutation
    added:
    - type: PermanentBlindness
      blindness: 4

# Blind makes you blind. Who knew?
# The above comment was brought to you by /tg/station13
- type: entity
  parent: BaseMutation
  id: MutationBlindness
  name: Слепота
  description: Делает подопытного абсолютно слепым.
  components:
  - type: Mutation
    instability: -40
  - type: RemovesMutation
    removes:
    - MutationNearSightedness
  - type: ComponentMutation
    added:
    - type: PermanentBlindness

- type: entity
  parent: BaseMutation
  id: MutationThermalVision
  name: Термозрение
  description: Носитель этого генома способен визуально воспринимать уникальные тепловые сигнатуры людей.
  components:
  - type: Mutation
    instability: 35
    difficulty: 18
    rarity: Mythical
    # no conflict with blindness because thats some professor X shit
  - type: ComponentMutation
    added:
    - type: ThermalVision
      toggleAction: MutationActionThermalVision
      pulseTime: 10

- type: entity
  parent: ToggleThermalVision
  id: MutationActionThermalVision
  components:
  - type: Action
    useDelay: 25
  - type: EffectAction
    onPerformed: true
    effects:
    - !type:EyeDamage
      amount: 1 # default is negative so this does damage
      probability: 0.2 # eye damage is obscene compared to ss13 so average 0.2 vs 10 per use

- type: entity
  parent: BaseMutation
  id: MutationIlliterate
  name: Неграмотность
  description: Вызывает тяжелую форму афазии, которая не позволяет читать или писать.
  components:
  - type: Mutation
    instability: -40
  - type: ComponentMutation
    added:
    - type: BlockReading
    - type: BlockWriting

- type: entity
  parent: BaseMutationAdmeme # wizard and admeme only
  id: MutationLaserEyes
  name: Лазерные глаза
  description: Отражает концентрированный свет прямо из ваших глаз.
  components:
  - type: Mutation
    difficulty: 16
    rarity: Mythical
  # TODO: move out of goob hulk
