- type: entity
  parent: BaseMutation
  id: MutationVoidMagnet
  name: Магнит Бездны
  description: Редкий геном, притягивающий странные силы, которые обычно остаются незримыми.
  components:
  - type: Mutation
    instability: 25
  - type: ActionMutation
    action: ActionMutationVoidMagnet
  - type: MutationActionOnTrigger
  - type: RandomTrigger
    prob: 0.0025 # :)

- type: entity
  parent: BaseMutationAction
  id: ActionMutationVoidMagnet
  name: Призыв Бездны
  description: "Позволяет воззвать к странным силам извне. Осторожно: иногда Бездна может затянуть вас в себя совершенно случайно."
  components:
  - type: Action
    icon:
      sprite: _Trauma/Actions/mutations.rsi
      state: void_magnet
    useDelay: 60
  - type: InstantAction
    event: !type:EffectInstantActionEvent
  - type: EffectAction
    effects:
    - !type:PopupMessage
      type: Pvs
      visualType: LargeCaution
      method: PopupCoordinates
      messages:
      - entity-effect-popup-convoke-void
    - !type:Polymorph
      prototype: VoidMagnet
