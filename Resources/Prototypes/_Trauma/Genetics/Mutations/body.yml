# Free stability

- type: entity
  parent: BaseTriggerMutation
  id: MutationEpilepsy
  name: Эпилепсия
  description: Генетический дефект, вызывающий спорадические приступы. Осторожнее со вспышками!
  components:
  - type: Mutation
    instability: -30
  - type: RandomTrigger
    prob: 0.005 # 0.5%
  - type: TriggerOnFlashed # get flashed nerd
    prob: 0.7 # 70%
  - type: EntityEffectOnTrigger
    effects:
    - !type:RelayMutated
      effect: !type:NestedEffect
        conditions:
        - !type:NestedCondition
          proto: IsAwake
        proto: MutationSeizure

- type: entity
  parent: BaseTriggerMutation
  id: MutationCough
  name: Кашель
  description: Хронический кашель. Выдаст вас в самый неподходящий момент.
  components:
  - type: Mutation
    instability: -30
  - type: RandomTrigger
    prob: 0.025 # 2.5%
  - type: EntityEffectOnTrigger
    effects:
    - !type:RelayMutated
      effect: !type:NestedEffect
        conditions:
        - !type:NestedCondition
          proto: IsAwake
        proto: MutationCough

- type: entity
  parent: BaseMutation
  id: MutationParanoia
  name: Кашель
  description: Подопытный легко впадает в панику и может страдать от галлюцинаций.
  components:
  - type: Mutation
    instability: -30
  - type: RandomTrigger
    prob: 0.025 # 2.5%
  - type: EntityEffectOnTrigger
    effects:
    - !type:RelayMutated
      effect: !type:NestedEffect
        conditions:
        - !type:NestedCondition
          proto: IsAwake
        proto: MutationParanoia

# Height

- type: entity
  parent: BaseMutation
  id: MutationDwarfism
  name: Карликовость
  description: Мутация, считающаяся причиной аномально низкого роста.
  components:
  - type: Mutation
    instability: 10
    difficulty: 16
    rarity: Rare
    conflicts:
    - MutationAcromegaly
    - MutationGigantism
  - type: EffectsMutation
    added:
    - !type:Scale
      multiplier: 1, 0.8
    removed:
    - !type:Scale
      multiplier: 1, 1.25
    # TODO: adjust hitbox?

- type: entity
  parent: BaseMutation
  id: MutationAcromegaly
  name: Акромегалия
  description: "Мутация, вызывающая необычайно высокий рост."
  components:
  - type: Mutation
    instability: -30
    difficulty: 16
    conflicts:
    - MutationDwarfism
  - type: EffectsMutation
    added:
    - !type:Scale
      multiplier: 1, 1.25
    removed:
    - !type:Scale
      multiplier: 1, 0.8

- type: entity
  parent: BaseFreeMutation
  id: MutationGigantism
  name: Гигантизм
  description: Клетки подопытного разрастаются, занимая большую площадь, из-за чего он выглядит значительно крупнее.
  components:
  - type: Mutation
    difficulty: 12
    conflicts:
    - MutationDwarfism
  - type: EffectsMutation
    added:
    - !type:Scale
      multiplier: 1.2, 1.2
    - !type:ScaleFixtures
      multiplier: 1.2
    removed:
    - !type:Scale
      multiplier: 0.833333, 0.833333 # enjoy being permanently trolled by FP error mixels
    - !type:ScaleFixtures
      multiplier: 0.833333

# Disabilities

- type: entity
  parent: BaseMutation
  id: MutationClumsiness
  name: Неуклюжесть
  description: Геном, подавляющий определенные функции мозга. Хонк!
  components:
  - type: Mutation
    instability: -40
  - type: ComponentMutation
    added:
    - type: Clumsy
      gunShootFailDamage:
        types: # literally just copied semi random values a chud picked
          Blunt: 5
          Piercing: 4
          Heat: 3

- type: entity
  parent: [ BaseFreeMutation, BaseTriggerMutation ]
  id: MutationTourettes
  name: Синдром Туретта
  description: Хронический тик, заставляющий носителя выкрикивать ругательства.
  components:
  - type: RandomTrigger
    prob: 0.05
  - type: EntityEffectOnTrigger
    effects:
    - !type:RelayMutated
      effect: !type:WeightedRandomEffect
        conditions:
        - !type:NestedCondition
          proto: IsAwake
        children:
        - effect: !type:Emote # emote 33%
            emote: Twitch
        - effect: !type:Speak # local 33%
            id: TourettesSwearing
        - effect: !type:Speak # common 33%
            id: TourettesSwearing
            prefix: tourettes-prefix-radio

- type: entity
  parent: BaseMutation
  id: MutationDeafness
  name: Глухота
  description: Носитель этого генома абсолютно ничего не слышит.
  components:
  - type: Mutation
    instability: -40
  - type: ComponentMutation
    added:
    - type: Deaf
    # TODO: prevent it being removed by anything, use events or something

- type: entity
  parent: BaseMutation
  id: MutationMonkified
  name: Обезьянизация
  description: Странный геном. Считается, что именно он отличает обезьян от людей.
  components:
  - type: Mutation
    instability: -40 # mmmonky
    locked: true # specific to monkeys/kobolds (active) and humans/reptilians (dormant)
  - type: PolymorphMutation
    prototypes:
      Human: MutationMonkey
      Reptilian: MutationKobold
    reverts:
      Monkey: MutationHuman
      Kobold: MutationReptilian
    fallback: MutationHuman

# Powergaming

- type: entity
  abstract: true
  parent: BaseMutation
  id: BaseLightMutation
  components:
  - type: PointLight # this works on the mutation entity because the mutations container doesn't occlude lights
    radius: 3
    softness: 5
    enabled: true

- type: entity
  parent: BaseLightMutation
  id: MutationGlowy
  name: Свечение
  description: Вы постоянно излучаете свет случайного цвета и интенсивности.
  components:
  - type: Mutation
    instability: 5
    conflicts:
    - MutationAntiGlow
  - type: RandomPointLight
    energy: 0.5, 2.0

- type: entity
  parent: BaseLightMutation
  id: MutationAntiGlow
  name: Анти-свечение
  description: "Ваша кожа словно притягивает и поглощает свет, создавая вокруг вас область тьмы."
  components:
  - type: Mutation
    instability: 10
  - type: RemovesMutation
    removes:
    - MutationGlowy
  - type: PointLight
    energy: -3 # TODO: find a way to make this work

- type: entity
  parent: BaseMutation
  id: MutationStrength
  name: Сила
  description: Мышцы носителя слегка увеличиваются. Часто встречается у боксеров мирового уровня.
  components:
  - type: Mutation
    instability: 5
    difficulty: 16
  - type: StrengthMutation
  # TODO: exercise and fitness buffs

- type: entity
  parent: BaseMutation
  id: MutationStimmed
  name: Под стимуляторами
  description: Химический баланс носителя становится более стабильным, ускоряя метаболизм препаратов.
  components:
  - type: Mutation
    instability: 5
    difficulty: 16
  - type: MetabolismSpeedMutation # this isn't parity but it does nothing otherwise
    bonus: 0.25
  # TODO: exercise modifier if that ever gets added

- type: entity
  parent: BaseMutation
  id: MutationInsulated # tider holy grail
  name: Изоляция
  description: Тело носителя перестает проводить электрический ток.
  components:
  - type: Mutation
    instability: 25
    difficulty: 16
  - type: ComponentMutation
    added:
    - type: Insulated

# Dangerous though potentially useful

- type: entity
  parent: [ BaseFreeMutation, BaseTriggerMutation ]
  id: MutationFierySweat
  name: Огненный пот
  description: Кожа носителя может случайно воспламениться, но в целом она гораздо устойчивее к ожогам.
  components:
  - type: Mutation
    difficulty: 14
    conflicts:
    - MutationHeatAdaptation
    # TG does not have it incompatible with thermal adaptation :) have fun
  - type: RandomTrigger
    prob: 0.0005 # 0.05%
  - type: EntityEffectOnTrigger
    effects:
    - !type:RelayMutated
      effect: !type:NestedEffect
        proto: MutationFierySweat
  - type: ArmorMutation
    modifiers:
      coefficients: # in tg it seems to apply for all burn damage, not just heat
        Heat: 0.5
        Cold: 0.5
        Shock: 0.5
        Caustic: 0.5

# if some yml warrior adds endermen give them this trust
- type: entity
  parent: BaseMutation
  id: MutationSpatialInstability
  name: Пространственная нестабильность
  description: Жертва мутации имеет слабую связь с реальностью и может внезапно переместиться в пространстве. Часто вызывает сильную тошноту.
  components:
  - type: Mutation
    instability: -30
    difficulty: 18
  - type: ComponentMutation
    added:
    - type: ChaoticJump # technically anom infection can add this too but idgaf
      jumpMinInterval: 15 # these are also the exact values anoms use
      jumpMaxInterval: 25
      rangeMin: 10
      rangeMax: 15
      effect: PuddleSparkle # TODO: copy shit from tg

- type: entity
  parent: BaseTriggerMutation
  id: MutationAcidicFlesh
  name: Кислотная плоть
  description: Под кожей подопытного скапливаются едкие химикаты. Часто приводит к летальному исходу.
  components:
  - type: Mutation
    instability: -40
    difficulty: 18
  - type: RandomTrigger
    prob: 0.13 # 13%
  - type: UseDelay # for the popup
    delay: 20
  - type: EntityEffectOnTrigger
    effects:
    - !type:NestedEffect
      conditions:
      - !type:UseDelayCondition
      proto: MutationAcidicFleshBubble
    - !type:RelayMutated
      effect: !type:NestedEffect
        probability: 0.15
        proto: MutationAcidicFleshPop

- type: entity
  parent: BaseTriggerMutation
  id: MutationSpastic
  name: Спазмы
  description: Подопытный страдает от непроизвольных мышечных судорог.
  components:
  - type: Mutation
    instability: -30
    difficulty: 16
  - type: RandomTrigger
    prob: 0.15 # 15%
  - type: EntityEffectOnTrigger
    effects:
    - !type:RelayMutated
      effect: !type:NestedEffect
        proto: MutationSpasms

- type: entity
  parent: BaseTriggerMutation
  id: MutationTwoLeftFeet
  name: Две левые ноги
  description: Мутация, заменяющая правую стопу на еще одну левую. Симптомы включают внезапные «поцелуи» с полом при ходьбе.
  components:
  - type: Mutation
    instability: -30
    difficulty: 16
  - type: TriggerOnWalk
  - type: EntityEffectOnTrigger
    effects:
    - !type:RelayMutated
      probability: 0.03 # 3% per tile walked - tg is 0.5% but its too rare for -30, so free
      effect: !type:NestedEffect
        conditions:
        - !type:StandingCondition # bro is not tripping on the floor
        proto: MutationFeetTrip

- type: entity
  parent: BaseMutation
  id: MutationInternalMartyrdom
  name: Внутреннее мученичество
  description: Мутация, заставляющая тело детонировать при смерти. Не наносит урона, но ОЧЕНЬ дезориентирует окружающих.
  components:
  - type: Mutation
    instability: -40
  - type: TriggerOnMobstateChange
    mobState: [ Dead ] # TODO: add hardcrit when implemented
  - type: EntityEffectOnTrigger
    effects:
    - !type:RelayMutated
      effect: !type:NestedEffect
        proto: MutationInternalMartyrdom

- type: entity
  parent: BaseMutation
  id: MutationHeadless
  name: С.О.Г.
  description: "Мутация, при которой тело отвергает голову, а мозг перемещается в грудную клетку. С.О.Г. — Синдром Отторжения Головы. Внимание: удаление этой мутации крайне опасно, хотя она и регенерирует не жизненно важные органы головы."
  components:
  - type: Mutation
    instability: -40
    difficulty: 12
  - type: EffectsMutation
    ignoreAutomatic: true # shapeshift system will handle the organs and parts being mirrored
    added:
    - !type:NestedEffect
      conditions:
      - !type:HasOrganSlot
        organ: Brain
        partType: Head
      proto: MutationRemoveHead
    removed:
    - !type:NestedEffect
      conditions:
      - !type:HasOrganSlot
        organ: Brain
        partType: Torso
      proto: MutationAddHead

# Peak of powergaming technology

- type: entity
  parent: BaseMutation
  id: MutationHypermetabolicBlood
  name: Гиперметаболическая кровь
  description: Кровь подопытного вырабатывается значительно быстрее нормы.
  components:
  - type: Mutation
    instability: 10
    difficulty: 16
  - type: BleedingMutation
    bleedModifier: 3 # non-parity: 1.5x bleeding feels too weak given this is a fairly strong mutation (nearly ignore bloodloss)

- type: entity
  parent: BaseMutation
  id: MutationRockEater
  name: Камнежуй
  description: Организм подопытного способен переваривать камни и минералы.
  components:
  - type: Mutation
    instability: 10
    difficulty: 12
    conflicts:
    - MutationRockAbsorber # can't stack them, one-way conflict to allow upgrading
  # TODO

- type: entity
  parent: MutationRockEater
  id: MutationRockAbsorber
  name: Камнесос
  description: Организм подопытного способен поглощать камни и минералы, перенимая их физические свойства.
  components:
  - type: Mutation
    instability: 35
    conflicts: [] # uninherit conflicts so it doesn't conflict with itself
  - type: RemovesMutation
    removes:
    - MutationRockEater
  # TODO

- type: entity
  parent: BaseMutation
  id: MutationInexorable
  name: Неумолимость
  description: Ваше тело способно выйти далеко за пределы человеческой выносливости. Однако чрезмерное давление может нанести организму тяжелые повреждения.
  components:
  - type: Mutation
    instability: 25
    difficulty: 24
  - type: MobThresholdMutation
    removed: SoftCrit

