- type: entity
  parent: BaseMutation
  id: MutationTongueSpike
  name: Язык-гарпун
  description: Позволяет существу добровольно выстреливать своим языком как смертоносным оружием.
  components:
  - type: Mutation
    instability: 5
    conflicts:
    - MutationChemSpike
  - type: ActionMutation
    action: ActionMutationTongueSpike

- type: entity
  parent: BaseMutationAction
  id: ActionMutationTongueSpike
  name: Выстрелить языком
  description: Выстрелите языком в направлении клика. Он вонзится в цель и будет наносить урон, пока его не извлекут.
  components:
  - type: Action
    icon:
      sprite: _Trauma/Actions/mutations.rsi
      state: spike
    useDelay: 1
  - type: TargetAction
    range: 10
  - type: WorldTargetAction
    event: !type:ShootOrganActionEvent
  - type: ShootOrganAction
    organ: Tongue
    polymorph: TongueSpike

- type: entity
  parent: MutationTongueSpike
  id: MutationChemSpike
  name: Химический гарпун
  description: Позволяет существу выстреливать языком как биомассой, обеспечивая дистанционную передачу химикатов.
  components:
  - type: Mutation
    instability: 10
    conflicts: [] # uninherit
  - type: RemovesMutation
    removes:
    - MutationTongueSpike
  - type: ActionMutation
    action: ActionMutationChemSpike
  - type: ChemSpikeMutation
    action: ActionMutationChemSpikeSend

- type: entity
  parent: ActionMutationTongueSpike
  id: ActionMutationChemSpike
  name: Выстрелить хим-гарпуном
  description: Выстрелите языком в направлении клика. Пока шип находится в теле цели, вы можете передавать ей свои реагенты.
  components:
  - type: Action
    icon:
      sprite: _Trauma/Actions/mutations.rsi
      state: chemspike
  - type: ShootOrganAction
    polymorph: TongueSpikeChem

# only added if the spike embeds in a mob
- type: entity
  parent: BaseMutationAction
  id: ActionMutationChemSpikeSend
  name: Передать химикаты
  description: Перекачайте все свои реагенты в того, в ком застрял химический шип. Одноразовое использование.
  components:
  - type: Action
    icon:
      sprite: _Trauma/Actions/mutations.rsi
      state: chemspike_swap
  - type: InstantAction
    event: !type:ChemTransferActionEvent
  - type: ChemTransferAction
