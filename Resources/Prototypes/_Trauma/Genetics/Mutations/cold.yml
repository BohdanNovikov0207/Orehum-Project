- type: entity
  parent: BaseMutation
  id: MutationGeladikinesis
  name: Геладикинез
  description: Позволяет носителю концентрировать влагу и силы абсолютного нуля для создания снега.
  components:
  - type: Mutation
    instability: 10
    difficulty: 10
  - type: ActionMutation
    action: ActionMutationGeladikinesis

- type: entity
  parent: BaseMutation
  id: MutationCryokinesis
  name: Криокинез
  description: Извлекает отрицательную энергию из ледяной пустоты, чтобы замораживать всё вокруг по воле подопытного.
  components:
  - type: Mutation
    instability: 25
    difficulty: 12
    rarity: Rare
  - type: ActionMutation
    action: ActionMutationCryokinesis

- type: entity
  parent: BaseConjureAction
  id: ActionMutationGeladikinesis
  name: Создать снег
  description: Концентрирует криокинетические силы для создания снега, пригодного для "снежного" строительства.
  components:
  - type: Action
    itemIconStyle: BigAction
    icon:
      sprite: Objects/Consumable/Food/frozen.rsi
      state: cone
  - type: ConjureAction
    spawn: FoodFrozenSnowcone # TODO: if anyone ever makes a snow item, spawn that instead

- type: entity
  parent: ActionMutationPyrokinesis
  id: ActionMutationCryokinesis
  name: Криолуч
  description: Эта способность выпускает в цель леденящий энергетический заряд.
  components:
  - type: Action
    useDelay: 16
    icon:
      sprite: _Trauma/Actions/mutations.rsi
      state: icebeam
  - type: WorldTargetAction
    event: !type:ProjectileSpellEvent
      prototype: BulletTemperatureCryo
