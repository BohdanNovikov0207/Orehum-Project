- type: entity
  abstract: true
  parent: BaseMutation
  id: BaseMutationAdaptation
  components:
  - type: Mutation
    instability: 25
    difficulty: 16
    rarity: Rare
    conflicts:
    - MutationThermalAdaptation
    - MutationPressureAdaptation

- type: entity
  parent: BaseMutationAdaptation
  id: MutationColdAdaptation
  name: Адаптация к холоду
  description: Странная мутация, дарующая носителю иммунитет к урону от низких температур.
  #It also prevents the host from slipping on ice.
  components:
  - type: ComponentMutation
    added:
    - type: SpecialLowTempImmunity
  # TODO: ice slippy thing

# TODO: give this to ashwalkers by default
- type: entity
  parent: BaseMutationAdaptation
  id: MutationHeatAdaptation
  name: Адаптация к жаре
  description: Странная мутация, дарующая иммунитет к высоким температурам и воспламенению. Также защищает от пепельных бурь.
  components:
  - type: ComponentMutation
    added:
    - type: SpecialHighTempImmunity
    - type: FireImmunity
    - type: WeatherImmune # safe from ash storms

- type: entity
  parent: BaseMutation
  id: MutationThermalAdaptation
  name: Термальная адаптация
  description: Сложная мутация, дарующая иммунитет к урону как от низких, так и от высоких температур. Не защищает от перепадов давления.
  components:
  - type: Mutation
    instability: 35
    difficulty: 32 # powergamers delight
    rarity: Mythical
    conflicts:
    - MutationPressureAdaptation
  - type: RemovesMutation
    removes:
    - MutationColdAdaptation
    - MutationHeatAdaptation
  - type: ComponentMutation
    added:
    - type: SpecialLowTempImmunity
    - type: SpecialHighTempImmunity

- type: entity
  parent: BaseMutationAdaptation
  id: MutationPressureAdaptation
  name: Адаптация к давлению
  description: Странная мутация, дарующая иммунитет к урону от экстремально низкого и высокого давления. Не защищает от температур, включая холод открытого космоса.
  components:
  - type: Mutation
    conflicts: # cant combine temp and pressure at all
    - MutationColdAdaptation
    - MutationHeatAdaptation
    - MutationThermalAdaptation
  - type: ComponentMutation
    added:
    - type: PressureImmunity
