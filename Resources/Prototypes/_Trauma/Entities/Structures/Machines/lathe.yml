  name: сборщик микроэлектроники
  description: Позволяет создавать нелегальные технологии, полезные для дела революции.
  components:
  - type: Sprite
    sprite: _Trauma/Structures/Machines/microelectronicsassembler.rsi
  - type: Lathe
    producingSound: /Audio/_Trauma/Revs/microelectronicsassembler.ogg
    runningState: microelectronicsassembler
    staticPacks:
    - RevMicroElectronicsStatic
  - type: MaterialStorage
    whitelist:
      tags:
      - Sheet
      - RawMaterial
      - Ingot
  - type: Construction
    node: microelectronics assembler
  - type: BlueprintReceiver
    whitelist:
      tags:
      - DataChip
  - type: ContainerContainer
    containers:
      blueprint: !type:Container
  - type: EmptyOnMachineDeconstruct
    containers:
    - blueprint

- type: entity
  parent: BaseRevIndustry
  id: RevUniformPrinter
  name: принтер военной формы
  description: Создаёт бронированную одежду для войск.
  components:
  - type: Sprite
    sprite: _Trauma/Structures/Machines/uniformprinter.rsi
  - type: Lathe
    producingSound: /Audio/Machines/uniformprinter.ogg
    runningState: uniformsewer
    staticPacks:
    - RevClothingStatic
  - type: Construction
    node: uniform printer
  - type: MaterialStorage
    whitelist:
      tags:
        - Sheet
        - RawMaterial
        - Ingot

- type: entity
  parent: BaseRevIndustry
  id: RevTechAnalyzer
  name: анализатор технологий
  description: Сканирует технологии NT и создает диски с данными, которые сборщик микроэлектроники может использовать для производства.
