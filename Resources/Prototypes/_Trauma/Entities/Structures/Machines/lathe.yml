    sprite: _Trauma/Structures/Machines/techanalyzer.rsi
  - type: Lathe
    producingSound: /Audio/Machines/uniformprinter.ogg
    runningState: techAnalyzer
    staticPacks:
    - RevTechStatic
  - type: Construction
    node: tech analyzer
  - type: MaterialStorage
    whitelist:
      tags:
      - Sheet
      - RawMaterial
      - Ingot

- type: entity
  parent: BaseRevIndustry
  id: RevPlasmaFoundry
  name: плазменная плавильня
  description: Продвинутая плавильня, работающая на плазме. Она невероятно быстро плавит металлы и позволяет создавать сложные высокотехнологичные компоненты.
  components:
  - type: Sprite
    sprite: _Trauma/Structures/Machines/plasmaforge.rsi
  - type: Lathe
    producingSound: /Audio/_Trauma/Revs/foundryaudio.ogg
    runningState: plasmaforge
    staticPacks:
    - RevFoundryStatic
  - type: MaterialStorage
    whitelist:
      tags:
      - Sheet
      - Metal
      - Wooden
      - RawMaterial
      - Plastic
  - type: PointLight
    enabled: true
    color: "#E25822"
    radius: 3.5
    energy: 5.0
  - type: ContainerContainer
    containers:
      blueprint: !type:Container
  - type: Construction
    node: plasma foundry

- type: entity
  parent: BaseRevIndustry
  id: RevPowerArmorStand
  name: Подставка для брони
  description: Подставка для брони, используемая для демонстрации брони MARK-1.
  components:
  - type: Sprite
    sprite: _Trauma/Structures/Machines/powerarmorstand.rsi
    layers:
    - state: chains
      map: [ "chains" ]
    - state: station
      map: ["station"]
  - type: Construction
    graph: PowerArmorStand
    node: start
  - type: Strap
    buckleOnInteractHand: false
    addBuckleverb: false
    buckleOffset: "0, 0.2"
    whitelist:
      tags:
      - T45Frame
