    runningState: bulletpress
    staticPacks:
    - RevBulletPressStatic
  - type: MaterialStorage
    whitelist:
      tags:
      - Sheet
      - RawMaterial
      - Ingot
  - type: Construction
    node: RevBulletPress

- type: entity
  parent: BaseRevIndustry
