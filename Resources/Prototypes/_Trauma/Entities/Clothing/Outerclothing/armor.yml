- type: entity
  parent: [ ClothingOuterBaseMedium, AllowSuitStorageClothing ]
  id: ClothingOuterArmorRev
  name: нагрудник
  description: Наспех сделанная броня для народа.
  components:
  - type: Item
    size: Ginormous
  - type: Sprite
    sprite: _Trauma/Clothing/OuterClothing/Armor/revchestplate.rsi
  - type: Clothing
    sprite: _Trauma/Clothing/OuterClothing/Armor/revchestplate.rsi
  - type: Armor
    coverage:
    - Chest
    traumaDeductions:
      Dismemberment: 0.2
      OrganDamage: 0.2
      BoneDamage: 0.2
      VeinsDamage: 0
      NerveDamage: 0
    modifiers:
      coefficients:
        Blunt: 0.7
        Slash: 0.7
        Piercing: 0.7
        Heat: 0.8
  - type: ClothingSpeedModifier
    walkModifier: 0.9
    sprintModifier: 0.9
  - type: ExplosionResistance
    damageCoefficient: 0.90
  - type: ModifyDelayedKnockdown
    delayDelta: 2
    knockdownTimeDelta: -2
  - type: StaminaResistance
    damageCoefficient: 0.3

- type: entity
  parent: [ClothingOuterStorageBase, AllowSuitStorageClothing]
  id: ClothingOuterVestWebRev
  name: жилет из паутины
  description: Высококачественный бронежилет из твердого синтетического материала. Удивительно гибкий и легкий, несмотря на внушительные бронепластины.
  components:
  - type: Sprite
    sprite: Clothing/OuterClothing/Vests/mercwebvest.rsi
  - type: Clothing
    sprite: Clothing/OuterClothing/Vests/mercwebvest.rsi
  - type: Armor
    traumaDeductions:
      Dismemberment: 0.2
      OrganDamage: 0.2
      BoneDamage: 0.2
      VeinsDamage: 0
      NerveDamage: 0
    coverage:
    - Chest
    modifiers:
      coefficients:
        Blunt: 0.4
        Slash: 0.4
        Piercing: 0.2
        Heat: 0.8
  - type: ExplosionResistance
    damageCoefficient: 0.9
  - type: ModifyDelayedKnockdown
    delayDelta: 2.25
    knockdownTimeDelta: -2.25
  - type: StaminaResistance
    damageCoefficient: 0.3
  - type: Construction
    graph: RevVest
    deconstructionTarget: null
    node: bullet

- type: entity
  parent: [ ClothingOuterStorageBase, AllowSuitStorageClothing ]
  id: ClothingOuterVestReflectRev
  name: зеркальный жилет
  description: Бронежилет с продвинутым экранированием, защищающий от энергетического оружия.
  components:
  - type: Sprite
    sprite: _Trauma/Clothing/OuterClothing/Vests/revreflective.rsi
  - type: Clothing
    sprite: _Trauma/Clothing/OuterClothing/Vests/revreflective.rsi
  - type: Armor
    coverage:
    - Chest
    modifiers:
      coefficients:
        Blunt: 0.8
        Slash: 0.7
        Piercing: 0.7
        Heat: 0.2
  - type: Reflect
    reflectProb: 0.6
    reflects:
    - Energy
    reflectingInHands: false
  - type: PointLight
    enabled: true
    radius: 1.5
    softness: 5
    color: "#4acff7"
  - type: Construction
    graph: RevVest
    deconstructionTarget: null
    node: reflect
  - type: StaminaResistance
    damageCoefficient: 0.3

- type: entity
  parent: [ ClothingOuterBaseMedium, AllowSuitStorageClothing ]
  id: ClothingOuterArmorRevFlame
  name: броня огнемётчика
  description: Тяжёлая броня, полностью защищающая владельца от огня.
  components:
  - type: Item
    size: Ginormous
  - type: Sprite
    sprite: _Trauma/Clothing/OuterClothing/Armor/revflamearmor.rsi
  - type: Clothing
    sprite: _Trauma/Clothing/OuterClothing/Armor/revflamearmor.rsi
  - type: Armor
    coverage:
    - Chest
    traumaDeductions:
      Dismemberment: 0.2
      OrganDamage: 0.2
      BoneDamage: 0.2
      VeinsDamage: 0
      NerveDamage: 0
    modifiers:
      coefficients:
        Blunt: 0.7
        Slash: 0.7
        Piercing: 0.7
        Heat: 0.5
  - type: ClothingSpeedModifier
    walkModifier: 0.9
    sprintModifier: 0.9
  - type: ExplosionResistance
    damageCoefficient: 0.90
  - type: ModifyDelayedKnockdown
    delayDelta: 2
    knockdownTimeDelta: -2
  - type: StaminaResistance
    damageCoefficient: 0.3
  - type: FireProtection
    reduction: 0.8
  - type: HeldSpeedModifier
  - type: ToggleableClothing
    clothingPrototypes:
      head: ClothingHelmetRevFlame
  - type: SelfExtinguisher
    cooldown: 1
    requiresIgniteFromGasImmune: false
    sound:
      path: /Audio/_Trauma/Revs/flamethrower.ogg
  - type: ContainerContainer
    containers:
      toggleable-clothing: !type:Container {}
