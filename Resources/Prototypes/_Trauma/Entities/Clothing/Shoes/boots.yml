- type: entity
  parent: [ClothingShoesMilitaryBase]
  id: ClothingShoesBootsRev
  name: рабочие ботинки
  description: Надежные рабочие ботинки, которые помогают сохранять равновесие, быстрее подниматься на ноги и продолжать движение даже при ранениях. Могут быть усилены бронепластиной.
  components:
  - type: Sprite
    sprite: _Trauma/Clothing/Shoes/Boots/workboots.rsi
  - type: Clothing
    sprite: _Trauma/Clothing/Shoes/Boots/workboots.rsi
  - type: ClothingSlowOnDamageModifier
    modifier: 0.5
  - type: Construction
    graph: RevBoots
    defaultTarget: finished
    deconstructionTarget: null
    node: unfinished

- type: entity
  parent: ClothingShoesBootsRev
  id: ClothingShoesBootsRevSteel
  name: рабочие ботинки со стальным носком
  description: Рабочие ботинки, модифицированные для безопасной ходьбы по калтропам.
  components:
  - type: Sprite
    sprite: _Trauma/Clothing/Shoes/Boots/steeltoed.rsi
  - type: Clothing
    sprite: _Trauma/Clothing/Shoes/Boots/steeltoed.rsi
  - type: StepTriggerImmune # Works by inventory relay
    whitelist:
      types:
      - Caltrop
  - type: Construction
    defaultTarget: null
    node: finished
