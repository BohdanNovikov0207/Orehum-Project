    sprite: _Trauma/Objects/Weapons/Guns/Flamethrower/flamethrower.rsi
    state: icon
  - type: Item
    size: Ginormous
  - type: Wieldable
  - type: GunRequiresWield
  - type: Gun
    minAngle: 0
    maxAngle: 0
    fireRate: 15
    burstFireRate: 15
    burstCooldown: .5
