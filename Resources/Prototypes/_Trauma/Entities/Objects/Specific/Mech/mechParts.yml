- type: entity
  parent: [PowerCellHyper]
  id: FusionCore
  name: термоядерное ядро
  suffix: Full
  description: Термоядерное ядро может использоваться в качестве батареи очень большой емкости, но чаще всего применяется для питания бронекостюмов MARK-1.
  components:
  - type: Sprite
    sprite: _Trauma/Objects/Devices/fusionCore.rsi
    layers:
    - map: [ "enum.PowerCellVisualLayers.Base" ]
      state: fusion_core
    - map: [ "enum.PowerCellVisualLayers.Unshaded" ]
      state: o2
      shader: unshaded
  - type: Item
    size: Normal
  - type: Tag
    tags:
    - FusionCore

- type: entity
  parent: [BaseMechWeaponMelee, CombatMechEquipment]
  id: WeaponMechMeleePowerFist
  name: силовой кулак
  suffix: Mech Weapon, Melee
  description: Бронированная перчатка с приводным тараном или аналогичным устройством, повышающим эффективность ударов, используемая в броне MARK-1.
  components:
  - type: Sprite
    sprite: _Trauma/Objects/Weapons/Melee/powerfist.rsi
    state: powerfist
  - type: MeleeThrowOnHit
    distance: 5
    speed: 30
  - type: MeleeWeapon
    canWideSwing: false
    angle: 0
    wideAnimationRotation: -90
    soundHit:
      collection: PowerFistHit
    attackRate: 0.5
    damage:
      groups:
        Brute: 30
      types:
        Structural: 60

- type: entity
  parent: [ BaseMechWeaponRange, CombatMechEquipment ]
  id: WeaponMechCombatFlameThrower
  name: тяжелый огнемет fO-46 mk3
  suffix: Mech Weapon, Gun, Combat, Flame
  description: Из метательного устройства издает огнемет, может использоваться в броне MARK-1.
  components:
  - type: Sprite
    sprite: _Trauma/Objects/Weapons/Guns/Flamethrower/flamethrower.rsi
    state: icon
  - type: BasicEntityAmmoProvider
    proto: FlameThrowerBullet
    capacity: 250
    count: 250
  - type: Buckleable
  - type: Gun
    minAngle: 0
    maxAngle: 0
    fireRate: 5
    burstFireRate: 5
    burstCooldown: .5
    shotsPerBurst: 5
    projectileSpeed: 20
    selectedMode: FullAuto
    availableModes:
    - FullAuto
    - Burst
    soundGunshot:
      path: /Audio/_Trauma/Revs/flamethrower.ogg
  - type: AmmoCounter
  - type: UseDelay
    delay: 1
