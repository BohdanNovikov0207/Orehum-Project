## Morph

- type: entity
  parent: BaseGameRule
  id: MorphRule
  components:
  - type: StationEvent
    earliestStart: 20
    weight: 3
    minimumPlayers: 30
    duration: null
    occursDuringRoundEnd: false
  - type: MorphRule
  - type: AntagRandomSpawn
  - type: AntagSpawner
    prototype: MobMorph
  - type: AntagSelection
    selectionTime: PostPlayerSpawn
    agentName: morph-name-user
    definitions:
    - spawnerPrototype: GhostRoleSpawnerMorph
      min: 1
      max: 1
      briefing:
        text: morph-role-greeting
        color: lime
        sound: /Audio/_Trauma/Morph/mutate.ogg
      mindRoles:
      - MindRoleMorph
