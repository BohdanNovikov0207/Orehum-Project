- type: entity
  parent: BaseAction
  id: ActionMorphReplicate
  name: Реплика
  description: "Копирует ваши клетки, создавая вашу копию. Стоимость: 80 единиц биомассы."
  components:
  - type: Action
    icon:
      sprite: _Trauma/Mobs/morph.rsi
      state: morph
  - type: InstantAction
    event: !type:MorphReplicateActionEvent

- type: entity
  parent: BaseAction
  id: ActionMorph
  name: Морф
  description: Преобразуйте свое тело, чтобы оно имитировало внешний вид чего угодно.
  components:
  - type: Action
    itemIconStyle: BigAction
    icon:
      sprite: Objects/Consumable/Drinks/mug_one.rsi
      state: icon-0
  - type: TargetAction
    interactOnMiss: false
  - type: EntityTargetAction
    whitelist:
      components:
      - MobState
      - Anchorable
      - Item
      tags:
      - Bot
    event: !type:MorphActionEvent

- type: entity
  parent: BaseAction
  id: ActionUnMorph
  name: Ан-Морф
  description: Пытается вернуть вас в исходную форму, если вы подверглись трансформации.
  components:
  - type: Action
    icon:
      sprite: Objects/Devices/chameleon_projector.rsi
      state: icon
  - type: InstantAction
    event: !type:UnMorphActionEvent

- type: entity
  parent: ActionDevour
  id: ActionMorphDevour
  description: Пожирает существо или предмет. Увеличивает его биомассу.
  components:
  - type: EntityTargetAction
    whitelist:
      components:
      - MobState
      - Item
