- type: entity
  parent:
  - Incorporeal
  - BaseMob
  id: MobCosmicAstralAscended
  name: astral ascended
  description: Transcendant, ascendant.
  components:
  - type: Input
    context: "ghost"
  - type: Spectral
  - type: MovementSpeedModifier
    baseWalkSpeed: 6
    baseSprintSpeed: 6
  - type: Sprite
    sprite: _DV/CosmicCult/Mobs/astralform.rsi
    layers:
    - state: effect-underlay
      shader: unshaded
    - state: ascended-body
      shader: unshaded
  - type: NoSlip
  - type: Eye
    drawFov: false
  - type: ContentEye
    maxZoom: 1.2, 1.2
  - type: Speech
    speechSounds: CosmicSpeech
    speechVerb: Ghost
  - type: PointLight
    color: "#42a4ae"
    radius: 2
    energy: 3
    softness: 1
    castShadows: false
  - type: LightBehaviour
    behaviours:
     - !type:FadeBehaviour
       interpolate: Linear
       minDuration: 5.5
       maxDuration: 5.5
       startValue: 1
       endValue: 3
       property: Energy
       enabled: true
       isLooped: true
       reverseWhenFinished: true

- type: entity
  parent: [ Incorporeal, BaseMob ]
  id: MobCosmicAstralProjection
  name: astral projection
  description: Neither here nor there.
  components:
  - type: ActionGrant
    actions:
    - ActionCosmicReturn
  - type: Input
    context: "ghost"
  - type: Spectral
  - type: MovementSpeedModifier
    baseWalkSpeed: 4
    baseSprintSpeed: 4
  - type: Sprite
    sprite: _DV/CosmicCult/Mobs/astralform.rsi
    layers:
    - state: base-body
      shader: unshaded
    drawdepth: Ghosts
  - type: NoSlip
  - type: CosmicAstralBody
  - type: Eye
    drawFov: false
    visMask:
    - Normal
    - CosmicCultMonument
    - Ghost
  - type: StatusIcon
    bounds: -0.5,-0.5,0.5,0.5
  - type: MindContainer
  - type: MindExaminable
  - type: Examiner
  - type: ContentEye
    maxZoom: 1.2, 1.2
  - type: Speech
    enabled: false
  - type: PointLight
    color: "#42a4ae"
    radius: 2
    energy: 3.5
    softness: 1
    castShadows: false
  - type: LightBehaviour
    behaviours:
     - !type:FadeBehaviour
       interpolate: Linear
       minDuration: 5.5
       maxDuration: 5.5
       startValue: 2
       endValue: 3.5
       property: Energy
       enabled: true
       isLooped: true
       reverseWhenFinished: true
  - type: IntrinsicRadioReceiver
  - type: ActiveRadio
    channels:
    - CosmicRadio
  - type: Visibility
    layer: 32 #monument vis layer

- type: entity
  parent: [ Incorporeal, BaseMob ]
  id: MobCosmicShatteredForm
  name: shattered form
  description: Separated from the body by a malign ritual, stuck between "here" and "there".
  components:
  - type: Input
    context: "ghost"
  - type: Spectral
  - type: MovementSpeedModifier
    baseWalkSpeed: 6
    baseSprintSpeed: 6
  - type: Sprite
    sprite: _DV/CosmicCult/Mobs/astralrogue.rsi
    layers:
    - state: base
      shader: unshaded
    drawdepth: Ghosts
  - type: NoSlip
  - type: Eye
    drawFov: false
  - type: SSDIndicator
  - type: StatusIcon
    bounds: -0.5,-0.5,0.5,0.5
  - type: MindContainer
  - type: MindExaminable
  - type: Examiner
  - type: Speech
    enabled: false
  - type: PointLight
    color: "#42a4ae"
    radius: 2
    energy: 3.5
    softness: 1
    castShadows: false
  - type: LightBehaviour
    behaviours:
     - !type:FadeBehaviour
       interpolate: Linear
       minDuration: 5.5
       maxDuration: 5.5
       startValue: 2
       endValue: 3.5
       property: Energy
       enabled: true
       isLooped: true
       reverseWhenFinished: true
  - type: StatusEffects # Overwriting status effects
    allowed:
    - SlowedDown
    - RadiationProtection
    - Adrenaline
  - type: MeleeWeapon
    hidden: true
    angle: 90
    range: 2
    animation: WeaponArcCosmic
    attackRate: 1
    clickDamageModifier: 1
    damage:
      types:
        Slash: 3
        Asphyxiation: 3
        Cold: 3
        Structural: 20
    soundHit:
      path: /Audio/_DV/CosmicCult/cosmicsword_hit.ogg
      params:
        variation: 0.2
        volume: -4
    soundSwing:
      path: /Audio/_DV/CosmicCult/cosmicweapon_swing.ogg
      params:
        variation: 0.125
        volume: -4
    soundNoDamage:
      path: /Audio/_DV/CosmicCult/cosmicsword_glance.ogg
      params:
        variation: 0.2
        volume: -11
  - type: StaminaDamageOnHit
    damage: 32
  - type: Puller
    needsHands: false
  - type: MobState
  - type: MobStateActions
    actions:
      Critical:
      - ActionCritSuccumb
      - ActionCritLastWords
  - type: MobThresholds
    thresholds:
      0: Alive
      375: Critical
      450: Dead
  - type: SlowOnDamage
    speedModifierThresholds:
      225: 0.7
      375: 0.5
  - type: Butcherable
    spawned:
    - id: AscendedDendrite
      amount: 1
  - type: InteractionPopup
    successChance: 0.25
    interactSuccessString: petting-success-rogue-ascended
    interactFailureString: petting-failure-rogue-ascended
    interactFailureSound:
      path: /Audio/_DV/CosmicCult/ascendant_noise.ogg
    soundPerceivedByOthers: false
  - type: RandomMetadata
    nameSegments:
    - ascended_names
    - ascended_titles
  - type: WeakToHoly # Goobstation Shitchap
    alwaysTakeHoly: true
