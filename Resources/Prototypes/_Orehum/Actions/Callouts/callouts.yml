- type: entity
  parent: BaseAction
  id: OrehumActionCalloutAttack
  name: Отдать приказ атаковать
  components:
  - type: Action
    itemIconStyle: NoItem
    icon:
      sprite: _MC/Actions/actions.rsi
      state: attack
    useDelay: 30
  - type: InstantAction
    event: !type:AttackCalloutActionEvent
  - type: ActionSharedCooldown
    id: OrehumActionCalloutAttack
    ids:
    - OrehumActionCalloutDefend
    - OrehumActionCalloutRetreat
    - OrehumActionCalloutRally
    cooldown: 30

