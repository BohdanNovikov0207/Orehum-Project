# RED
- type: entity
  parent: AirlockGlassShuttle
  id: AirlockGlassShuttleRedAssault
  suffix: Red, Assault
  components:
  - type: PriorityDock
    tag: RedAssault
  - type: ContainerFill
    containers:
      board: [ DoorElectronicsExternal ]

- type: entity
  parent: AirlockGlassShuttleRedAssault
  id: AirlockGlassShuttleRedAssaultFill
  suffix: Red, Filled, Assault
  components:
  - type: PriorityDock
    tag: RedAssault
  - type: GridFill
    path: /Maps/_Orehum/ME4TA/war/assault/RED-assault.yml
    addComponents:
    - type: IFF
      flags:
      - HideLabel

